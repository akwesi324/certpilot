<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36" fill="none">
  <defs>
    <linearGradient id="cp-full-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="cp-full-shield" x1="7.5" y1="5.5" x2="24.5" y2="26.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="cp-full-check" x1="11" y1="21.8" x2="22" y2="13.2" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="cp-text-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Logo Mark (32x32 at offset 2,2) -->
  <g transform="translate(2, 2)">
    <!-- Squircle Base -->
    <rect width="32" height="32" rx="8" fill="url(#cp-full-bg)" />
    <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1" />

    <!-- Cybersecurity Shield -->
    <path d="M16 5.5L24.5 9V15.5C24.5 20.8 20.8 24.8 16 26.5C11.2 24.8 7.5 20.8 7.5 15.5V9L16 5.5Z" 
          fill="#0F172A" 
          fill-opacity="0.5" 
          stroke="url(#cp-full-shield)" 
          stroke-width="1.4" 
          stroke-linejoin="round" />

    <!-- Pilot Delta Craft (Left Facet) -->
    <path d="M16 8.2L10.2 17.2L16 15.2V8.2Z" fill="#FFFFFF" fill-opacity="0.95" />

    <!-- Pilot Delta Craft (Right Facet) -->
    <path d="M16 8.2L21.8 17.2L16 15.2V8.2Z" fill="#CBD5E1" fill-opacity="0.8" />

    <!-- Dynamic Certification Checkmark (Pass Trajectory) -->
    <path d="M11 18.2L14.6 21.8L22 13.2" 
          stroke="url(#cp-full-check)" 
          stroke-width="2.2" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Wordmark -->
  <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="20" font-weight="700" letter-spacing="-0.03em" fill="#0F172A">
    Cert<tspan fill="url(#cp-text-grad)">Pilot</tspan>
  </text>
</svg>
