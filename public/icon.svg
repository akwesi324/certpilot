<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="cp-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="cp-shield-stroke" x1="16" y1="5.5" x2="16" y2="26.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="cp-check" x1="11" y1="18.2" x2="22" y2="13.2" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="32" height="32" rx="8" fill="url(#cp-bg)" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1" />

  <!-- Cybersecurity Shield -->
  <path d="M16 5.5L24.5 9V15.5C24.5 20.8 20.8 24.8 16 26.5C11.2 24.8 7.5 20.8 7.5 15.5V9L16 5.5Z" 
        fill="#1E1B4B" 
        fill-opacity="0.4" 
        stroke="url(#cp-shield-stroke)" 
        stroke-width="1.4" 
        stroke-linejoin="round" />

  <!-- Pilot Delta Craft (Left Facet) -->
  <path d="M16 8.2L10.2 17.2L16 15.2V8.2Z" fill="#FFFFFF" fill-opacity="0.95" />

  <!-- Pilot Delta Craft (Right Facet) -->
  <path d="M16 8.2L21.8 17.2L16 15.2V8.2Z" fill="#E0E7FF" fill-opacity="0.75" />

  <!-- Dynamic Certification Checkmark (Pass Trajectory) -->
  <path d="M11 18.2L14.6 21.8L22 13.2" 
        stroke="url(#cp-check)" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
